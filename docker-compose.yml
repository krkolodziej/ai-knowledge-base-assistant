services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-kb-db
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ai_kb}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ai-kb-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: "${APP_NAME:-AI Knowledge Base Assistant}"
      APP_ENV: "docker"
      API_PREFIX: "${API_PREFIX:-/api/v1}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_kb}"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-768}"
      CHUNK_SIZE_CHARS: "${CHUNK_SIZE_CHARS:-1000}"
      CHUNK_OVERLAP_CHARS: "${CHUNK_OVERLAP_CHARS:-150}"
      OLLAMA_BASE_URL: "${API_OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-llama3.1:8b}"
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
      OLLAMA_REQUEST_TIMEOUT_SECONDS: "${OLLAMA_REQUEST_TIMEOUT_SECONDS:-60}"
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
